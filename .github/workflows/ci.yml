name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and checks
        run: |
          python -m pip install -e ".[test]"
          python -m pip install ruff

      - name: Lint Python sources
        run: python -m ruff check --select E4,E7,E9,F app.py src tests

      - name: Check Python syntax and imports
        run: python -m compileall -q app.py src tests

      - name: Run tests
        run: python -m pytest
