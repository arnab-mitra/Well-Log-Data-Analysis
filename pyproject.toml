[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "welllog"
version = "0.1.0"
description = "Deterministic FORCE 2020 well-log lithology workflow"
requires-python = ">=3.10"
dependencies = [
  "lasio>=0.31,<1",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<4",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]
app = ["streamlit>=1.40,<2", "pyarrow>=18,<24"]
notebook = ["jupyter>=1.1,<2", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
all = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "streamlit>=1.40,<2",
  "pyarrow>=18,<24",
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<8",
]

[project.scripts]
welllog = "welllog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["welllog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
